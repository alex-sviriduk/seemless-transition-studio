name: Validate studio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  audio-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
